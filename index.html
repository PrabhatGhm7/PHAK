<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHAK Flight Path</title>
<style>
/* Layout idea: one-column iOS app. Large title, a "next session" hero, a Duolingo-style winding route of 143 nodes,
   floating Liquid-Glass tab bar, and a draggable session sheet that turns reading into a route you fly. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --bg: #eef2f8;
  --bg-2: #dfe8f5;
  --ink: #0b1220;
  --ink-2: #4b5567;
  --ink-3: #8a93a3;
  --accent: #0a7cff;
  --accent-ink: #ffffff;
  --gold: #ffb800;
  --flame: #ff6a00;
  --good: #22b14c;
  --glass: rgba(255,255,255,.62);
  --glass-strong: rgba(255,255,255,.82);
  --glass-edge: rgba(255,255,255,.85);
  --hair: rgba(15,23,42,.08);
  --card: rgba(255,255,255,.78);
  --fill: rgba(118,128,150,.12);
  --shadow: 0 1px 1px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.08);
  --shadow-lg: 0 2px 6px rgba(15,23,42,.06), 0 24px 60px rgba(15,23,42,.18);
  --node-off: #d5dce7;
  --node-off-depth: #b7c1d0;
  --blob-a: #8ec5ff; --blob-b: #ffd3a8; --blob-c: #c7b8ff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#05070d; --bg-2:#0b1222; --ink:#f3f6fb; --ink-2:#a9b2c3; --ink-3:#6b7486;
    --accent:#3d9bff; --glass:rgba(28,32,44,.58); --glass-strong:rgba(30,34,46,.86); --glass-edge:rgba(255,255,255,.14);
    --hair:rgba(255,255,255,.08); --card:rgba(26,30,42,.72); --fill:rgba(120,130,160,.18);
    --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
    --node-off:#2a3142; --node-off-depth:#1a1f2c; --blob-a:#1d4fa0; --blob-b:#6b3415; --blob-c:#3f2a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#05070d; --bg-2:#0b1222; --ink:#f3f6fb; --ink-2:#a9b2c3; --ink-3:#6b7486;
  --accent:#3d9bff; --glass:rgba(28,32,44,.58); --glass-strong:rgba(30,34,46,.86); --glass-edge:rgba(255,255,255,.14);
  --hair:rgba(255,255,255,.08); --card:rgba(26,30,42,.72); --fill:rgba(120,130,160,.18);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --node-off:#2a3142; --node-off-depth:#1a1f2c; --blob-a:#1d4fa0; --blob-b:#6b3415; --blob-c:#3f2a8a;
  color-scheme: dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Ambient sky behind the glass */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--bg-2),var(--bg) 60%)}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.sky i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:var(--blob-a)}
.sky i:nth-child(2){width:45vmax;height:45vmax;right:-18vmax;top:10vh;background:var(--blob-c);opacity:.4}
.sky i:nth-child(3){width:50vmax;height:50vmax;left:10vw;bottom:-30vmax;background:var(--blob-b);opacity:.35}

/* Liquid glass material */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-edge), inset 0 0 0 .5px var(--hair), var(--shadow)}

/* Top bar: appears as you scroll past the large title */
.topbar{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display:flex;align-items:center;gap:10px;border-radius:0;transition:opacity .25s ease}
.topbar .t{flex:1;font-weight:600;font-size:17px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1)}
.topbar.scrolled .t{opacity:1;transform:none}
.topbar:not(.scrolled){background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;font:600 15px/1 var(--font-round);font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}
.chip.flame{color:var(--flame)} .chip.xp{color:#c98a00}
:root[data-theme="dark"] .chip.xp{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.xp{color:var(--gold)}}
.chip.timer{color:var(--accent);display:none}
.chip.timer.on{display:inline-flex}

main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 60px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.view{display:none}
.view.on{display:block;animation:viewIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.large{font:700 34px/1.08 var(--font);letter-spacing:-.025em;margin:6px 4px 4px;text-wrap:balance}
.sub{color:var(--ink-2);margin:0 4px 20px;font-size:15px}

/* Hero: next session */
.hero{position:relative;border-radius:28px;padding:20px;margin-bottom:22px;overflow:hidden}
.hero .eyebrow{font:600 13px/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.hero h2{font:700 24px/1.15 var(--font);letter-spacing:-.02em;margin:8px 0 6px;text-wrap:balance}
.hero .meta{color:var(--ink-2);font-size:15px}
.hero-row{display:flex;gap:14px;align-items:center;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;font-weight:600;font-size:17px;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s ease-out, filter .2s}
.btn:active{transform:scale(.96)}
.btn[disabled]{background:var(--fill);color:var(--ink-3);box-shadow:none;cursor:default}
.btn.wide{width:100%}
.btn.ghost{background:var(--fill);color:var(--ink);box-shadow:none}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{border-radius:18px;padding:12px;background:var(--fill)}
.stat b{display:block;font:700 22px/1.1 var(--font-round);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}

/* Rings (Apple Fitness) */
.ring{--p:0;position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--fill)}
.ring .bar{transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.3,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 15px/1.05 var(--font-round)}
.ring .lbl small{display:block;font:500 10px/1 var(--font);color:var(--ink-2);margin-top:2px}

/* Route (path view) */
.unit{position:relative;border-radius:24px;padding:16px 18px;margin:28px 0 18px;color:#fff;overflow:hidden;
  box-shadow:0 10px 28px color-mix(in srgb,var(--c1) 35%,transparent), inset 0 1px 0 rgba(255,255,255,.35);
  background:linear-gradient(135deg,var(--c1),var(--c2))}
.unit::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.unit .k{font:600 12.5px/1 var(--font);text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.unit h3{margin:6px 0 2px;font:700 20px/1.2 var(--font);letter-spacing:-.015em;text-wrap:balance}
.unit .ch{font-size:14px;opacity:.9}
.unit .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden}
.unit .bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.unit .note{font-size:13.5px;opacity:.92;margin-top:8px}
.route{position:relative;padding:4px 0 8px}
.stop{position:relative;display:flex;align-items:center;height:96px}
.node{position:absolute;left:50%;width:68px;height:62px;margin-left:-34px;border-radius:50%;display:grid;place-items:center;
  font:800 17px/1 var(--font-round);color:var(--ink-3);background:var(--node-off);box-shadow:0 7px 0 var(--node-off-depth);
  transition:transform .12s ease-out, box-shadow .12s ease-out}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--node-off-depth)}
.node svg{width:28px;height:28px}
.node.done{color:#fff;background:linear-gradient(180deg,#ffd34d,#ffb000);box-shadow:0 7px 0 #d18a00}
.node.done:active{box-shadow:0 2px 0 #d18a00}
.node.cur{color:#fff;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 7px 0 color-mix(in srgb,var(--c2) 70%,#000)}
.node.cur::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid color-mix(in srgb,var(--c1) 45%,transparent);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
.node.review{border-radius:22px}
.bubble{position:absolute;left:50%;top:-30px;transform:translateX(-50%);padding:6px 12px;border-radius:12px;background:var(--glass-strong);color:var(--accent);
  font:800 13px/1 var(--font-round);letter-spacing:.06em;box-shadow:var(--shadow);white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--glass-strong)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.stop .lab{position:absolute;width:calc(50% - 60px);font-size:14px;line-height:1.25;color:var(--ink-2)}
.stop .lab b{display:block;color:var(--ink);font-weight:600;font-size:14.5px}
.stop .lab.r{left:calc(50% + 50px)} .stop .lab.l{right:calc(50% + 50px);text-align:right}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trail path{fill:none;stroke:var(--node-off);stroke-width:6;stroke-linecap:round;stroke-dasharray:1 14}

/* Checklist (iOS inset grouped) */
.seg{display:flex;padding:3px;border-radius:12px;background:var(--fill);margin:0 0 16px;position:relative}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:600;position:relative;z-index:1;color:var(--ink-2)}
.seg button.on{color:var(--ink)}
.seg .knob{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--glass-strong);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 0 0 .5px var(--hair)}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--fill);padding:0 12px;margin-bottom:12px;color:var(--ink-3)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;font-size:16px}
.group h4{margin:22px 16px 7px;font:600 13px/1.2 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);display:flex;justify-content:space-between}
.list{border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px;position:relative;width:100%;text-align:left;transition:background .15s}
.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--hair)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.chk svg{width:16px;height:16px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.done .chk{background:var(--good);border-color:var(--good)}
.done .chk svg{opacity:1;transform:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;font-size:16px;line-height:1.3}
.row.done .tx b{color:var(--ink-2)}
.row .tx span{font-size:13px;color:var(--ink-3)}
.row .num{font:600 13px/1 var(--font-round);color:var(--ink-3);font-variant-numeric:tabular-nums}
.row.pop .chk{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.35)}}
.empty{padding:30px 16px;text-align:center;color:var(--ink-2)}

/* Progress */
.card{border-radius:24px;padding:18px;margin-bottom:16px}
.rank{display:flex;gap:16px;align-items:center}
.wings{width:64px;height:64px;flex:none;border-radius:20px;display:grid;place-items:center;background:linear-gradient(160deg,#2a6df4,#0a2a7a);color:#ffd34d;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(10,60,180,.35)}
.wings svg{width:40px;height:40px}
.rank h3{margin:0;font:700 22px/1.15 var(--font);letter-spacing:-.015em}
.rank p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.xpbar{height:12px;border-radius:9px;background:var(--fill);margin-top:14px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ffcf3d,#ff9f0a);transition:width 1s cubic-bezier(.2,.9,.3,1)}
.xpnote{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.rings3{display:flex;justify-content:space-around;gap:8px;text-align:center}
.rings3 .cap{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.sec{font:700 20px/1.2 var(--font);letter-spacing:-.015em;margin:26px 4px 10px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:15px;height:15px;border-radius:4px;background:var(--fill)}
.heat i.l1{background:color-mix(in srgb,var(--good) 45%,transparent)} .heat i.l2{background:color-mix(in srgb,var(--good) 75%,transparent)} .heat i.l3{background:var(--good)}
.heat i.today{outline:2px solid var(--accent);outline-offset:1px}
.heatcap{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px;margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:12.5px;line-height:1.2;color:var(--ink-2)}
.medal{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 20px/1 var(--font-round);position:relative;
  background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.18),0 6px 16px color-mix(in srgb,var(--c2) 40%,transparent)}
.medal::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(255,255,255,.45)}
.badge.locked .medal{filter:grayscale(1);opacity:.35;box-shadow:none}
.badge b{color:var(--ink);font-weight:600;font-size:13px}
.settings .rowx{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px}
.settings .rowx+.rowx{border-top:.5px solid var(--hair)}
.stepper{display:flex;border-radius:10px;background:var(--fill);overflow:hidden}
.stepper button{width:44px;height:34px;font-size:20px;font-weight:500}
.stepper span{min-width:30px;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.sync{font-size:13px;color:var(--ink-3);text-align:center;margin-top:8px}
.sync .card{text-align:left;font-size:15px;color:var(--ink)}

/* Tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:30;display:flex;padding:5px;border-radius:999px;gap:2px}
.tabbar button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:92px;height:56px;border-radius:999px;font-size:11px;font-weight:600;color:var(--ink-2);transition:color .25s}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}
.tabbar .knob{position:absolute;top:5px;height:56px;width:92px;border-radius:999px;background:var(--fill);box-shadow:inset 0 1px 0 var(--glass-edge)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;height:calc(100% - env(safe-area-inset-top) - 18px);
  border-radius:34px 34px 0 0;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-edge),var(--shadow-lg);transform:translateY(110%);display:flex;flex-direction:column;will-change:transform;visibility:hidden}
.sheet.open{visibility:visible}
.grab{flex:none;padding:8px 18px 6px;touch-action:none;cursor:grab}
.grab .h{width:40px;height:5px;border-radius:9px;background:var(--ink-3);opacity:.5;margin:0 auto 10px}
.sh-top{display:flex;align-items:flex-start;gap:12px}
.sh-top .tx{flex:1;min-width:0}
.sh-k{font:600 13px/1.2 var(--font);color:var(--c1);text-transform:uppercase;letter-spacing:.06em}
.sh-title{font:700 26px/1.12 var(--font);letter-spacing:-.022em;margin:6px 0 4px;text-wrap:balance}
.sh-meta{font-size:14px;color:var(--ink-2)}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.xbtn svg{width:16px;height:16px}
.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--fill);overflow:hidden}
.steps i b{display:block;height:100%;width:0;background:var(--c1);border-radius:9px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 18px calc(env(safe-area-inset-bottom) + 24px)}
.blk{border-radius:22px;background:var(--card);padding:16px;margin:12px 0;box-shadow:inset 0 0 0 .5px var(--hair)}
.blk h5{margin:0 0 4px;font:700 17px/1.2 var(--font);display:flex;align-items:center;gap:8px}
.blk h5 .xp{margin-left:auto;font:700 12.5px/1 var(--font-round);color:#c98a00;background:color-mix(in srgb,var(--gold) 20%,transparent);padding:5px 8px;border-radius:999px}
.blk .hint{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:17px;height:17px}

/* Reading as a flight: waypoints along a route */
.wps{position:relative;margin:6px 0 0;padding-left:4px}
.wps .line{position:absolute;left:21px;top:22px;bottom:22px;width:3px;border-radius:3px;background:repeating-linear-gradient(var(--ink-3) 0 6px,transparent 6px 12px);opacity:.45}
.wps .fill{position:absolute;left:21px;top:22px;width:3px;border-radius:3px;background:var(--c1);height:0;transition:height .6s cubic-bezier(.2,.9,.3,1)}
.plane{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;z-index:2;box-shadow:0 4px 12px color-mix(in srgb,var(--c1) 50%,transparent)}
.plane svg{width:18px;height:18px;transform:rotate(90deg)}
.wp{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:9px 0;min-height:46px}
.wp .dot{flex:none;width:36px;height:28px;display:grid;place-items:center}
.wp .dot i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink-3);background:var(--card);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.wp.on .dot i{background:var(--c1);border-color:var(--c1);transform:scale(1.15)}
.wp .w{flex:1;font-size:15.5px;line-height:1.3}
.wp.on .w{color:var(--ink-2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-3) 70%,transparent)}
.wp .tag{font:700 11px/1 var(--font-round);color:var(--ink-3)}
.landed{display:none;margin-top:8px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);font-weight:600;font-size:14.5px}
.landed.on{display:block;animation:viewIn .4s}

.learn{display:flex;flex-direction:column;gap:10px}
.lc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px;border-radius:16px;background:var(--fill);transition:background .25s, transform .12s}
.lc:active{transform:scale(.985)}
.lc .q{flex:1;font-size:15.5px;line-height:1.35}
.lc .q small{display:block;font:700 11px/1 var(--font-round);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.lc.on{background:color-mix(in srgb,var(--good) 14%,transparent)}
.lc.on .q small{color:var(--good)}
.task{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:2px 0}
.task .q{flex:1;font-size:15.5px;line-height:1.4}
.task.on .q{color:var(--ink-2)}
.task + .task{margin-top:12px;padding-top:12px;border-top:.5px solid var(--hair)}
.kicker{font:700 11px/1 var(--font-round);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;display:block}
.kicker.e{color:#8b5cf6}
.notes{width:100%;min-height:96px;border-radius:14px;border:0;padding:12px;background:var(--fill);resize:vertical;font-size:15.5px;line-height:1.45;outline:none}
.notes:focus{box-shadow:0 0 0 2px var(--accent)}
.timer{display:flex;align-items:center;gap:14px}
.timer .tbtns{display:flex;gap:8px;flex-wrap:wrap}
.timer .tbtns .btn{height:40px;padding:0 16px;font-size:15px}
.finish{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom) + 24px));margin:6px -18px 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 20px);background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 -.5px 0 var(--hair)}
.finish .why{font-size:13.5px;color:var(--ink-2);text-align:center;margin-top:8px}
.donepill{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);font-weight:700}

/* XP float + toast + modal */
.xpf{position:fixed;z-index:60;pointer-events:none;font:800 16px/1 var(--font-round);color:#e09600;text-shadow:0 1px 0 rgba(255,255,255,.6);animation:xpf .9s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);white-space:nowrap;max-width:calc(100% - 32px);z-index:70;transform:translate(-50%,-140%);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.toast.on{transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:700;margin-left:6px}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.mbox{width:min(360px,100%);border-radius:30px;padding:26px 22px 20px;text-align:center;transform:scale(.85);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.modal.on .mbox{transform:none}
.mbox .medal{width:96px;height:96px;margin:0 auto 14px;font-size:26px}
.mbox h3{margin:0 0 6px;font:700 24px/1.15 var(--font);letter-spacing:-.02em}
.mbox p{margin:0 0 18px;color:var(--ink-2);font-size:15.5px}
.mbox .btns{display:flex;flex-direction:column;gap:10px}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

@media (max-width:420px){
  .stop .lab{width:calc(50% - 52px);font-size:13px} .stop .lab b{font-size:13.5px}
  .tabbar button{width:84px} .tabbar .knob{width:84px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.15s!important}
}
@media (prefers-reduced-transparency: reduce){
  .glass,.sheet{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-strong)}
}

o": "", "ext": "build a 5 × 5 risk matrix (same structure as ICAO safety management) and score three hazards.", "extOnly": false}, {"n": 131, "title": "PAVE checklist and human factors", "pages": "pp 2-8 to 2-12", "read": ["The PAVE Checklist (Pilot, Aircraft, EnVironment, External Pressures)", "Human Factors", "Human Behavior"], "learn": ["how PAVE finds hazards before a flight", "why external pressures (\"get-there-itis\") cause so many accidents"], "do": "", "ext": "", "extOnly": false}, {"n": 132, "title": "Decision-making models", "pages": "pp 2-12 to 2-17", "read": ["The Decision-Making Process", "SRM", "The 5 Ps Check (Plan, Plane, Pilot, Passengers, Programming)", "Perceive, Process, Perform (3P)", "PAVE, CARE and TEAM Checklists"], "learn": ["how the 5 Ps and the 3P model are used during flight", "what CARE and TEAM add"], "do": "", "ext": "", "extOnly": false}, {"n": 133, "title": "DECIDE and decisions under pressure", "pages": "pp 2-18 to 2-23", "read": ["The DECIDE Model (Detect, Estimate, Choose, Identify, Do, Evaluate)", "Decision-Making in a Dynamic Environment", "Automatic Decision-Making", "Operational Pitfalls", "Stress Management", "Use of Resources"], "learn": ["each DECIDE step", "the operational pitfalls (scud running, continuing VFR into cloud, ignoring fuel reserves)"], "do": "apply DECIDE to a rough-running engine over mountains.", "ext": "", "extOnly": false}, {"n": 134, "title": "Situational awareness", "pages": "pp 2-24 to 2-25", "read": ["Situational Awareness", "Obstacles to Maintaining Situational Awareness", "Workload Management", "Managing Risks"], "learn": ["what situational awareness is", "how high workload and fatigue destroy it", "how to plan workload ahead of busy phases"], "do": "", "ext": "", "extOnly": false}, {"n": 135, "title": "Automation in the cockpit", "pages": "pp 2-25 to 2-32", "read": ["Automation", "Results of the Study", "Equipment Use", "Autopilot Systems", "Familiarity", "Respect for Onboard Systems", "Getting Beyond Rote Workmanship", "Understand the Platform", "Managing Aircraft Automation", "Information Management", "Enhanced Situational Awareness", "Automation Management", "Risk Management"], "learn": ["automation complacency", "mode confusion", "why pilots must know what the automation is doing at all times"], "do": "read a summary of Asiana 214 (San Francisco, 2013).", "ext": "", "extOnly": false}, {"n": 136, "title": "Review day", "pages": "", "read": [], "learn": [], "do": "re-read notes S120–S135. Pick one Nepal accident report and classify its causes using Chapters 2 and 17.", "ext": "", "extOnly": false}]}, {"id": "Phase 16", "title": "Consolidation and bridge to an MSc", "intro": "", "sessions": [{"n": 137, "title": "Glossary check, A to L", "pages": "PHAK Glossary", "read": [], "learn": [], "do": "cover each definition and explain 25 terms out loud. Note any you can't, and look up the session that covers them.", "ext": "", "extOnly": false}, {"n": 138, "title": "Glossary check, M to Z", "pages": "PHAK Glossary", "read": [], "learn": [], "do": "same method.", "ext": "", "extOnly": false}, {"n": 139, "title": "Practice test: aerodynamics, systems and instruments", "pages": "", "read": [], "learn": [], "do": "30 questions from the FAA's free sample Private Pilot (PAR) test. For every wrong answer, revisit the session that covers it.", "ext": "", "extOnly": false}, {"n": 140, "title": "Practice test: performance, weather and navigation", "pages": "", "read": [], "learn": [], "do": "30 questions, same method.", "ext": "", "extOnly": false}, {"n": 141, "title": "Practice test: regulations, airspace, airport operations and human factors", "pages": "", "read": [], "learn": [], "do": "30 questions, same method.", "ext": "", "extOnly": false}, {"n": 142, "title": "ICAO and the international rule system", "pages": "not in PHAK", "read": [], "learn": ["the Chicago Convention", "what ICAO Annexes are", "the ones most used in safety work (1 Licensing, 2 Rules of the Air, 6 O <script>
(() => {
"use strict";
/* ---------- Data ---------- */
const COLORS = [
  ["#0a84ff","#0051d5"],["#32ade6","#0077b6"],["#5e5ce6","#3634a3"],["#bf5af2","#8944ab"],["#ff375f","#c21f45"],
  ["#ff9f0a","#e06900"],["#ffcc00","#d49d00"],["#30d158","#1a9c3c"],["#00c7be","#00897f"],["#64d2ff","#1c8fd1"],
  ["#5e5ce6","#2f2d9e"],["#ff6482","#d0325a"],["#ac8e68","#7d6243"],["#0a84ff","#3634a3"],["#ff453a","#b3261e"],
  ["#bf5af2","#5e5ce6"],["#ffd60a","#ff9f0a"]
];
const BADGES = ["Rulebook","Air Mass","Aerodynamicist","Airframer","Powerplant","Panel Scan","Paperwork Pro","Balance Master",
  "Performance Pro","Sky Reader","Weather Briefer","Ramp Ready","Airspace Ace","Navigator","Flight Surgeon","Decision Maker","MSc Ready"];
const RANKS = [[0,"Ground School Cadet"],[600,"Student Pilot"],[1800,"First Solo"],[4000,"Private Pilot"],[7000,"Instrument Rated"],
  [10500,"Commercial Pilot"],[14500,"Flight Instructor"],[19000,"Airline Captain"]];
const XP = {read:5, learn:10, do:15, ext:25, notes:10, done:50};

const SESS = []; const BYN = {};
PHASES.forEach((p, pi) => {
  const m = p.title.match(/^(.*?)\s*\((.+)\)$/);
  p.name = m ? m[1] : p.title; p.ch = m ? m[2] : "";
  p.pi = pi; p.c = COLORS[pi % COLORS.length];
  p.sessions.forEach(s => { s.pi = pi; s.review = /^Review day/.test(s.title); SESS.push(s); BYN[s.n] = s; });
});
const N = SESS.length;

/* ---------- State + persistence ---------- */
const LS = "phak-flightpath-v1";
const blank = () => ({v:1, read:{}, learn:{}, task:{}, notes:{}, done:{}, goal:1, updated:0});
let S = blank();
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}
/* Cloud sync for hosting outside Claude (e.g. Vercel). Values come from config.js, which the build writes
   from Vercel environment variables, so no keys live in the repo. Without config.js and the page saves to this browser only (or to your Claude account when opened on Claude). */
const SUPABASE_URL = (window.PHAK_CONFIG || {}).supabaseUrl || "";
const SUPABASE_ANON_KEY = (window.PHAK_CONFIG || {}).supabaseAnonKey || "";

let syncMode = "local", remote = null, writing = false, pendingWrite = false, writeTimer = null;
let sb = null, sbUser = null, authMsg = "";

function save(){
  S.updated = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {}
  if (remote){ clearTimeout(writeTimer); writeTimer = setTimeout(flush, 900); }
}
async function flush(){
  if (!remote) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try { await remote.save(JSON.parse(JSON.stringify(S))); syncMode = remote.kind; }
  catch(e){ syncMode = "error"; }
  writing = false; renderSync();
  if (pendingWrite){ pendingWrite = false; flush(); }
}
function mergeRemote(r){
  if (!r || typeof r !== "object") return false;
  if ((r.updated || 0) <= (S.updated || 0)) return false;
  S = Object.assign(blank(), r);
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {}
  return true;
}

/* Supabase: email magic-link login, one row per user in table "progress" */
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function initSupabase(){
  try {
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{flowType:"pkce", persistSession:true, detectSessionInUrl:true}});
    const onUser = async (user) => {
      sbUser = user || null;
      if (!sbUser){ remote = null; syncMode = "local"; renderSync(); return; }
      remote = {kind: "supabase", save: async (state) => {
        const {error} = await sb.from("progress").upsert({user_id: sbUser.id, state, updated_at: new Date().toISOString()});
        if (error) throw error;
      }};
      const {data, error} = await sb.from("progress").select("state").eq("user_id", sbUser.id).maybeSingle();
      if (error){ syncMode = "error"; renderSync(); return; }
      if (data && mergeRemote(data.state)) renderAll();
      else if (S.updated && (!data || (S.updated > ((data.state || {}).updated || 0)))) flush();
      syncMode = "supabase"; renderSync();
      if (/[?&]code=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);
    };
    const {data:{session}} = await sb.auth.getSession();
    onUser(session && session.user);
    sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") onUser(session && session.user); });
  } catch(e){ syncMode = "error"; renderSync(); }
}
async function signIn(email){
  if (!sb) return;
  authMsg = "Sending…"; renderSync();
  const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname}});
  authMsg = error ? "Couldn't send the link: " + error.message : "Check your email and tap the sign-in link. Use the same browser.";
  renderSync();
}
async function signOut(){ if (sb) await sb.auth.signOut(); }

/* Claude-hosted fallback: per-user document in the artifact's store */
async function initClaude(){
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    remote = {kind: "cloud", save: (state) => ref.set(state)};
    let first = true;
    ref.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (snap.exists){
        if (mergeRemote(snap.data())) renderAll();
        else if (first && (S.updated || 0) > ((snap.data() || {}).updated || 0)) flush();
      } else if (first && S.updated){ flush(); }
      syncMode = "cloud"; first = false; renderSync();
    }, () => { remote = null; syncMode = "local"; renderSync(); });
  } catch(e) {}
}
if (SUPABASE_URL && SUPABASE_ANON_KEY) initSupabase(); else initClaude();

/* ---------- Derived values ---------- */
const today = () => dkey(new Date());
function dkey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
const isDone = n => !!S.done[n];
const arr = (o,n) => o[n] || [];
function sessXP(s){
  const n = s.n, t = S.task[n] || {};
  return arr(S.read,n).length*XP.read + arr(S.learn,n).length*XP.learn + (t.do?XP.do:0) + (t.ext?XP.ext:0)
    + ((S.notes[n]||"").trim().length >= 20 ? XP.notes : 0) + (isDone(n) ? XP.done : 0);
}
const totalXP = () => SESS.reduce((a,s) => a + sessXP(s), 0);
const doneCount = () => SESS.filter(s => isDone(s.n)).length;
function nextSession(){ return SESS.find(s => !isDone(s.n)) || null; }
function dayCounts(){ const c = {}; Object.values(S.done).forEach(d => { c[d] = (c[d]||0) + 1; }); return c; }
function streak(){
  const c = dayCounts(); let d = new Date(), k = 0;
  if (!c[dkey(d)]) d.setDate(d.getDate()-1);
  while (c[dkey(d)]){ k++; d.setDate(d.getDate()-1); }
  return k;
}
function rankOf(xp){
  let i = 0; while (i+1 < RANKS.length && xp >= RANKS[i+1][0]) i++;
  return {i, name:RANKS[i][1], lo:RANKS[i][0], hi: RANKS[i+1] ? RANKS[i+1][0] : null, next: RANKS[i+1] ? RANKS[i+1][1] : null};
}
const phaseDone = p => p.sessions.every(s => isDone(s.n));
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const pad = n => "S" + String(n).padStart(2,"0");
function estMin(s){ return s.review ? 35 : Math.min(45, 15 + s.read.length*3 + s.learn.length*3 + (s.ext?8:0)); }
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Spring (Apple: damping ratio + response) ---------- */
function spring({from, to, velocity = 0, damping = 1, response = 0.4, onUpdate, onDone}){
  if (reduce){ onUpdate(to); onDone && onDone(); return {stop(){}}; }
  const k = Math.pow(2*Math.PI/response, 2), c = 4*Math.PI*damping/response;
  let x = from, v = velocity, last = performance.now(), raf, stopped = false;
  const step = now => {
    if (stopped) return;
    let dt = Math.min(0.064, (now - last)/1000); last = now;
    const sub = 4; dt /= sub;
    for (let i=0;i<sub;i++){ const a = -k*(x-to) - c*v; v += a*dt; x += v*dt; }
    onUpdate(x);
    if (Math.abs(v) < 2 && Math.abs(x-to) < 0.3){ onUpdate(to); onDone && onDone(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return {stop(){ stopped = true; cancelAnimationFrame(raf); }, get value(){ return x; }, get velocity(){ return v; }};
}

/* ---------- Header chips ---------- */
let shownXP = 0, xpAnim = null;
function renderChips(){
  document.getElementById("streakChip").textContent = streak();
  const target = totalXP();
  if (xpAnim) xpAnim.stop();
  xpAnim = spring({from: shownXP, to: target, response: .8, onUpdate: v => { shownXP = v; document.getElementById("xpChip").textContent = Math.round(v).toLocaleString(); }});
}

/* ---------- Path view ---------- */
function ringSVG(p, c1, c2, size=76, w=9, id){
  const r = (size - w)/2, C = 2*Math.PI*r, off = C*(1 - Math.max(0, Math.min(1, p)));
  const gid = "g" + (id || Math.random().toString(36).slice(2));
  return `<svg viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${w}"/>
  <circle class="bar" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>`;
}
function renderHero(){
  const nx = nextSession(), d = doneCount(), todayN = dayCounts()[today()] || 0, goal = S.goal || 1;
  const h = document.getElementById("hero");
  if (!nx){
    h.innerHTML = `<div class="eyebrow">Course complete</div><h2>All 143 sessions logged. You've flown the whole PHAK.</h2>
      <div class="meta">Open the Logbook to see your badges.</div>`;
    return;
  }
  const p = PHASES[nx.pi];
  h.style.setProperty("--c1", p.c[0]); h.style.setProperty("--c2", p.c[1]);
  h.innerHTML = `
    <div class="eyebrow">${todayN >= goal ? "Goal met today · keep going?" : "Next session"}</div>
    <h2>${pad(nx.n)} · ${esc(nx.title)}</h2>
    <div class="meta">${esc(p.name)}${nx.pages ? " · " + esc(nx.pages) : ""} · about ${estMin(nx)} min</div>
    <div class="hero-row">
      <div class="ring">${ringSVG(todayN/goal, p.c[0], p.c[1], 76, 9, "hero")}<div class="lbl">${todayN}/${goal}<small>today</small></div></div>
      <button class="btn" style="flex:1" data-open="${nx.n}">${arr(S.read,nx.n).length||arr(S.learn,nx.n).length ? "Continue session" : "Start session"}</button>
    </div>
    <div class="stats3">
      <div class="stat"><b>${d}</b><span>of ${N} done</span></div>
      <div class="stat"><b style="color:var(--flame)">${streak()}</b><span>day streak</span></div>
      <div class="stat"><b>${Math.round(d/N*100)}%</b><span>of the PHAK</span></div>
    </div>`;
}
function renderRoute(){
  const nx = nextSession(); const out = [];
  PHASES.forEach(p => {
    const dn = p.sessions.filter(s => isDone(s.n)).length;
    out.push(`<div class="unit" style="--c1:${p.c[0]};--c2:${p.c[1]}">
      <div class="k">${esc(p.id)} · ${dn}/${p.sessions.length}</div>
      <h3>${esc(p.name)}</h3><div class="ch">${esc(p.ch)}</div>
      ${p.intro ? `<div class="note">${esc(p.intro)}</div>` : ""}
      <div class="bar"><i style="width:${dn/p.sessions.length*100}%"></i></div></div>`);
    out.push(`<div class="route" style="--c1:${p.c[0]};--c2:${p.c[1]}" data-pi="${p.pi}">`);
    p.sessions.forEach((s, i) => {
      const x = Math.round(Math.sin(i*0.85) * 72);
      const cls = isDone(s.n) ? "done" : (nx && nx.n === s.n ? "cur" : "");
      const inner = isDone(s.n) ? `<svg><use href="#i-check"/></svg>` : s.review ? `<svg><use href="#i-star"/></svg>` : s.n;
      const side = x > 0 ? "l" : "r";
      out.push(`<div class="stop" data-x="${x}">
        <div class="lab ${side}"><b>${esc(s.title)}</b>${pad(s.n)}${s.pages ? " · " + esc(s.pages) : ""}</div>
        <button class="node ${cls}${s.review ? " review" : ""}" style="transform:translateX(${x}px)" data-open="${s.n}" aria-label="${pad(s.n)} ${esc(s.title)}${isDone(s.n) ? ", completed" : ""}">
          ${cls === "cur" ? `<span class="bubble">${arr(S.read,s.n).length||arr(S.learn,s.n).length ? "CONTINUE" : "START"}</span>` : ""}${inner}</button>
      </div>`);
    });
    out.push(`</div>`);
  });
  document.getElementById("route").innerHTML = out.join("");
  // move label to the side away from the node
  document.querySelectorAll(".stop").forEach(st => {
    const x = +st.dataset.x, lab = st.querySelector(".lab");
    if (x > 0){ lab.style.right = `calc(50% - ${x}px + 50px)`; lab.style.left = "auto"; lab.className = "lab l"; }
    else { lab.style.left = `calc(50% + ${x}px + 50px)`; lab.style.right = "auto"; lab.className = "lab r"; }
  });
  drawTrails();
}
function drawTrails(){
  document.querySelectorAll(".route").forEach(r => {
    r.querySelector(".trail")?.remove();
    const W = r.clientWidth; const stops = [...r.querySelectorAll(".stop")];

// drag-to-dismiss with 1:1 tracking, velocity handoff and momentum projection
(() => {
  const g = document.getElementById("grab"); let startY = 0, startSheet = 0, hist = [], dragging = false, moved = false;
  g.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    dragging = true; moved = false; g.setPointerCapture(e.pointerId);
    if (sheetAnim) sheetAnim.stop();
    startY = e.clientY; startSheet = sheetY; hist = [{y:e.clientY,t:performance.now()}];
  });
  g.addEventListener("pointermove", e => {
    if (!dragging) return;
    let dy = e.clientY - startY; if (Math.abs(dy) > 4) moved = true;
    let y = startSheet + dy;
    if (y < 0) y = -(-y*60)/(60 + -y*0.55); // rubber-band above the top
    setSheetY(y);
    hist.push({y:e.clientY,t:performance.now()}); if (hist.length > 6) hist.shift();
  });
  const end = () => {
    if (!dragging) return; dragging = false;
    const a = hist[0], b = hist[hist.length-1]; const v = b && a && b.t > a.t ? (b.y - a.y)/((b.t - a.t)/1000) : 0;
    const projected = sheetY + (v/1000)*0.998/(1-0.998);
    if (moved && (projected > sheetH*0.45 || v > 900)) closeSheet(v);
    else { sheetAnim = spring({from: sheetY, to: 0, velocity: v, damping: .85, response: .35, onUpdate: setSheetY}); }
  };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
})();

/* ---------- Timer ---------- */
const timer = {total: 35*60, left: 35*60, running: false, iv: null, endAt: 0};
function timerToggle(){
  if (timer.running){ timer.running = false; clearInterval(timer.iv); }
  else {
    if (timer.left <= 0) timer.left = timer.total;
    timer.running = true; timer.endAt = Date.now() + timer.left*1000;
    timer.iv = setInterval(() => { timer.left = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
      if (timer.left <= 0){ timer.running = false; clearInterval(timer.iv); toast("35 minutes done. Wrap up and debrief"); buzz([30,60,30]); }
      renderTimer(); }, 1000);
  }
  renderTimer();
}
function timerReset(){ timer.running = false; clearInterval(timer.iv); timer.left = timer.total; renderTimer(); }
function renderTimer(){
  const mm = String(Math.floor(timer.left/60)).padStart(2,"0") + ":" + String(timer.left%60).padStart(2,"0");
  const chip = document.getElementById("timerChip"); chip.classList.toggle("on", timer.running || timer.left < timer.total);
  document.getElementById("timerChipT").textContent = mm;
  const r = document.getElementById("tRing");
  if (r){ r.innerHTML = ringSVG(1 - timer.left/timer.total, "#0a84ff", "#5e5ce6", 64, 7, "tm") + `<div class="lbl" style="font-size:13px">${mm}</div>`; }
  const g = document.getElementById("tGo"); if (g) g.textContent = timer.running ? "Pause" : timer.left < timer.total && timer.left > 0 ? "Resume" : "Start 35 min";
}
document.getElementById("timerChip").addEventListener("click", () => { const nx = nextSession(); if (nx) openSheet(nx.n); });

/* ---------- Toast, modal, confetti ---------- */
const toastEl = document.getElementById("toast"); let toastT = null;
function toast(msg, undo, n){
  toastEl.innerHTML = `<svg width="18" height="18" style="color:var(--good)"><use href="#i-check"/></svg><span>${esc(msg)}</span>${undo ? `<button data-undo="${n}">Undo</button>` : ""}`;
  toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), undo ? 4500 : 2200);
}
toastEl.addEventListener("click", e => { const b = e.target.closest("[data-undo]"); if (!b) return; delete S.done[b.dataset.undo]; save(); renderAll(); toastEl.classList.remove("on"); });
const modal = document.getElementById("modal");
function showModal(html){ document.getElementById("mbox").innerHTML = html; modal.classList.add("on"); confetti(); setTimeout(() => modal.querySelector("[data-close]")?.focus(), 50); }
function closeModal(){ modal.classList.remove("on"); }
modal.addEventListener("click", e => { if (e.target === modal || e.target.closest("[data-close]")) closeModal(); });

const fx = document.getElementById("fx"), ctx = fx.getContext("2d"); let parts = [], fxRaf = null;
function confetti(){
  if (reduce) return;
  const dpr = devicePixelRatio || 1; fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ["#ffcc00","#ff9f0a","#30d158","#0a84ff","#bf5af2","#ff375f","#64d2ff"];
  for (let i=0;i<140;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*1.6, sp = 9 + Math.random()*10;
    parts.push({x: innerWidth/2, y: innerHeight*0.72, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, w: 6+Math.random()*6, h: 8+Math.random()*8,
      r: Math.random()*6, vr: (Math.random()-.5)*.4, c: cols[i%cols.length], life: 0});
  }
  if (!fxRaf) fxRaf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p => { p.vy += .32; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - p.life/150); ctx.fillStyle = p.c;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3))); ctx.restore(); });
  parts = parts.filter(p => p.life < 150 && p.y < innerHeight + 40);
  fxRaf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,innerWidth,innerHeight), null);
}

/* ---------- Tabs, segmented control, routing ---------- */
let currentView = "path", tabAnim = null, tabX = null;
function moveKnob(knob, btn, animate, store){
  const x = btn.offsetLeft, w = btn.offsetWidth;
  knob.style.width = w + "px";
  if (!animate || store.x == null){ store.x = x; knob.style.transform = `translateX(${x}px)`; knob.style.left = "0"; return; }
  if (store.anim) store.anim.stop();
  store.anim = spring({from: store.x, to: x, damping: .8, response: .35, onUpdate: v => { store.x = v; knob.style.transform = `translateX(${v}px)`; }});
}
const tabStore = {}, segStore = {};
function show(v, animate=true){
  if (!["path","checklist","progress"].includes(v)) v = "path";
  currentView = v;
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "v-" + v));
  document.querySelectorAll("#tabbar button").forEach(b => { b.classList.toggle("on", b.dataset.v === v); b.setAttribute("aria-current", b.dataset.v === v ? "page" : "false"); });
  moveKnob(document.getElementById("tabKnob"), document.querySelector(`#tabbar button[data-v="${v}"]`), animate, tabStore);
  document.getElementById("toptitle").textContent = {path:"Flight Path",checklist:"Checklist",progress:"Logbook"}[v];
  if (v === "path") requestAnimationFrame(drawTrails);
  if (v === "checklist") requestAnimationFrame(() => moveKnob(document.getElementById("segKnob"), document.querySelector(`#seg button[data-f="${filter}"]`), false, segStore));
  scrollTo({top:0});
}
document.getElementById("tabbar").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; history.replaceState(null,"","#" + b.dataset.v); show(b.dataset.v); });
document.getElementById("seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.f;
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b)); moveKnob(document.getElementById("segKnob"), b, true, segStore); renderChecklist(); });
document.getElementById("q").addEventListener("input", e => { query = e.target.value; renderChecklist(); });
document.addEventListener("click", e => {
  const g = e.target.closest("[data-goal]"); if (g){ S.goal = Math.max(1, Math.min(5, (S.goal||1) + +g.dataset.goal)); save(); renderAll(); return; }
  const o = e.target.closest("[data-open]"); if (o && !o.closest("#sheet")) openSheet(+o.dataset.open);
});
function route(){
  const h = location.hash.slice(1);
  const m = h.match(/^s(\d+)$/);
  if (m && BYN[+m[1]]) { if (!document.querySelector(".view.on")) show("path", false); if (openN !== +m[1]) openSheet(+m[1]); return; }
  if (openN !== null) closeSheet();
  show(h || "path", false);
}
addEventListener("hashchange", route);
addEventListener("scroll", () => document.getElementById("topbar").classList.toggle("scrolled", scrollY > 50), {passive:true});
addEventListener("resize", () => { drawTrails(); moveKnob(document.getElementById("tabKnob"), document.querySelector("#tabbar button.on"), false, tabStore); sheetH = sheet.offsetHeight; });

function renderAll(){
  renderChips(); renderHero(); renderRoute(); renderChecklist(); renderProgress();
  if (openN !== null) renderSheet(false);
}
renderAll();
route();
// bring the current node into view on first load of the path
requestAnimationFrame(() => {
  if (currentView !== "path" || openN !== null) return;
  const cur = document.querySelector(".node.cur");
  if (cur && doneCount() > 2) cur.scrollIntoView({block:"center"});
});
})();
</script>
